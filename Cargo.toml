[package]
name = "hyperion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Live system resource monitor for Linux"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_plot = "0.37"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
